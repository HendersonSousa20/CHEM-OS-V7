name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - uses: actions/upload-artifact@v4
        with: { name: chemos-dist, path: dist, retention-days: 14 }
  full-scan:
    # varreduras longas (entradas extremas e injeção de HTML nos 55 módulos) contra o build de produção
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node scripts/test.js --dist --only fuzz,xss
