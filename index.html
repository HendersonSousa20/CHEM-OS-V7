        :root { --bg-color: #000000; --text-color: #00FF66; --accent-color: #00DD55; --border-color: #00FF66; }
        .theme-amber { --bg-color: #000000; --text-color: #FFB000; --accent-color: #E09C00; --border-color: #FFB000; }
        .theme-blue { --bg-color: #000080; --text-color: #FFFFFF; --accent-color: #00FFFF; --border-color: #FFFFFF; }
        .theme-mono { --bg-color: #0a0a0a; --text-color: #f0f0f0; --accent-color: #ffffff; --border-color: #cccccc; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'VT323', 'IBM Plex Mono', monospace; font-size: 1.2rem; line-height: 1.15; }
        .crt::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; z-index: 50; pointer-events: none; opacity: 0.35; }
        .no-crt::before { display: none !important; }
        .dos-border { border: 2px solid var(--border-color); border-radius: 0px !important; }
        .dos-input { background: transparent; color: var(--text-color); outline: none; border-bottom: 2px solid var(--border-color); border-radius: 0px; }
        .dos-btn { background-color: transparent; color: var(--text-color); border: 1px solid var(--border-color); padding: 2px 8px; cursor: pointer; border-radius: 0px !important; transition: all 0.1s ease; }
        .dos-btn:hover, .dos-btn:focus { background-color: var(--text-color); color: var(--bg-color); }
        .chem-img { filter: invert(0.88) hue-rotate(180deg) contrast(1.2); mix-blend-mode: screen; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); border: 1px solid var(--border-color); }
        ::-webkit-scrollbar-thumb { background: var(--text-color); }
        .test-pass { color: var(--ok-color, #00FF66); }
        .test-fail { color: var(--err-color, #FF4444); }

        /* ==========================================================================
           MOTION DESIGN — transições, microinterações e feedback visual
           ========================================================================== */

        /* Respeita usuários que pedem menos movimento no SO/navegador */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        }

        /* Flicker sutil e contínuo do efeito CRT, para a tela parecer "viva" */
        @keyframes crtFlicker { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.27; } }
        .crt::before { animation: crtFlicker 6s ease-in-out infinite; }

        /* Transição de entrada ao trocar de tela/módulo (renderHome / renderTool) */
        @keyframes screenFadeIn {
            from { opacity: 0; transform: translateY(10px); filter: blur(1px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .screen-fade-in { animation: screenFadeIn 0.32s cubic-bezier(0.2, 0.7, 0.3, 1) both; }

        /* Modal: aparição com leve "pop" em vez de corte seco */
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.94) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        #modal:not(.hidden) .dos-border { animation: modalPop 0.22s cubic-bezier(0.2, 0.7, 0.3, 1) both; }

        /* Botões do menu principal e demais botões soltos dentro das telas
           (não usam .dos-btn, então ganham sua própria transição + feedback de clique) */
        #screen-content button { transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.08s ease; }
        #screen-content button:active { transform: scale(0.97); }

        /* Botões e inputs: feedback tátil de clique/foco */
        .dos-btn { transition: background-color 0.12s ease, color 0.12s ease, transform 0.08s ease, box-shadow 0.2s ease; }
        .dos-btn:active { transform: scale(0.94); }
        .dos-input { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
        .dos-input:focus { box-shadow: 0 2px 6px -2px var(--text-color); }

        /* Pulso genérico usado para chamar atenção para um elemento recém-atualizado */
        @keyframes pulseGlowRing {
            0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--text-color) 60%, transparent); }
            100% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--text-color) 0%, transparent); }
        }
        .pulse-glow { animation: pulseGlowRing 0.6s ease-out; }

        /* Números que "batem" (tick) quando atualizados — usado no pHmetro */
        @keyframes valueTick {
            0% { transform: scale(1.22); }
            100% { transform: scale(1); }
        }
        .value-tick { display: inline-block; animation: valueTick 0.28s cubic-bezier(0.3, 1.4, 0.4, 1) both; }

        /* Laboratório guiado (Módulo 23): gota caindo da bureta no frasco */
        @keyframes geDropFall {
            0% { top: 0; opacity: 0; transform: translateX(-50%) scaleY(0.8); }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { top: 46px; opacity: 0; transform: translateX(-50%) scaleY(1.3); }
        }
        .ge-drop {
            position: absolute; left: 50%; width: 7px; height: 7px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, var(--accent-color) 70%);
            box-shadow: 0 0 6px var(--accent-color); pointer-events: none; z-index: 6;
            animation: geDropFall 0.55s ease-in forwards;
        }

        /* Impacto da gota no frasco: leve "squash" no vidro + transições suaves de cor/nível */
        @keyframes geFlaskHit {
            0% { transform: scale(1); }
            40% { transform: scale(1.045, 0.965); }
            100% { transform: scale(1); }
        }
        .ge-flask-hit { animation: geFlaskHit 0.32s ease-out; transform-origin: 50% 90%; }
        #ge-flask-fill { transition: fill 0.55s ease; }
        #ge-buret-fill { transition: height 0.45s cubic-bezier(0.3, 0.6, 0.3, 1); }

        /* Escala de pH ao vivo: faixa de viragem do indicador + marcador móvel */
        .ge-ph-track { position: relative; height: 14px; overflow: hidden; }
        .ge-ph-zone { position: absolute; top: 0; bottom: 0; background: rgba(255, 230, 0, 0.28); transition: left 0.3s ease, width 0.3s ease; }
        .ge-ph-marker {
            position: absolute; top: -4px; width: 3px; height: 22px; border-radius: 2px;
            background: var(--text-color); box-shadow: 0 0 7px var(--text-color);
            transition: left 0.4s cubic-bezier(0.3, 0.6, 0.3, 1);
        }

        /* Onda de destaque (tipo "sonar") ao marcar o ponto de viragem */
        @keyframes geViragemRing {
            0% { box-shadow: 0 0 0 0 rgba(255, 210, 0, 0.65); }
            100% { box-shadow: 0 0 0 26px rgba(255, 210, 0, 0); }
        }
        .ge-viragem-hit { animation: geViragemRing 0.75s ease-out; }
        /* Alias genérico do mesmo pulso, para destacar erros de validação inline
           em qualquer módulo (não só no laboratório guiado). */
        .field-error-flash { animation: geViragemRing 0.6s ease-out; }

        /* Linhas novas na tabela de dados entram deslizando */
        @keyframes geRowIn { from { opacity: 0; transform: translateX(-8px); background-color: rgba(255,255,255,0.08); } to { opacity: 1; transform: translateX(0); background-color: transparent; } }
        .ge-row-new { animation: geRowIn 0.4s ease-out; }

        /* Blocos do relatório final entram em sequência (stagger) */
        @keyframes geFadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .ge-fade-item { animation: geFadeUp 0.4s ease-out both; }
        .ge-fade-item:nth-child(1) { animation-delay: 0s; }
        .ge-fade-item:nth-child(2) { animation-delay: 0.08s; }
        .ge-fade-item:nth-child(3) { animation-delay: 0.16s; }
        .ge-fade-item:nth-child(4) { animation-delay: 0.24s; }
        .ge-fade-item:nth-child(5) { animation-delay: 0.32s; }

        /* ==========================================================================
           ACESSIBILIDADE — foco visível, texto oculto para leitor de tela, skip-link
           ========================================================================== */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }
        .skip-link {
            position: absolute; left: -999px; top: 0; z-index: 100;
            background: var(--text-color); color: #000; padding: 8px 14px;
            font-weight: bold; text-decoration: none;
        }
        .skip-link:focus { left: 8px; top: 8px; }

        /* Foco visível consistente com o tema (em vez do outline azul padrão do
           navegador, que destoa da estética do terminal) — nunca remove o foco,
           só o estiliza, preservando a navegação por teclado. */
        a:focus-visible, button:focus-visible, input:focus-visible,
        select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid var(--text-color);
            outline-offset: 2px;
            box-shadow: 0 0 8px var(--text-color);
        }

        /* Emblemas de perigo GHS (Módulo 2) */
        .ghs-pictogram {
            width: 32px; height: 32px; flex-shrink: 0; border: 2px solid #e30613; background: #fff;
            border-radius: 3px; transform: rotate(45deg); display: flex; align-items: center; justify-content: center;
        }
        .ghs-pictogram span { transform: rotate(-45deg); font-size: 15px; line-height: 1; }

        /* Impressão de relatórios (Módulo 23: experimento guiado; Módulo 25: ficha
           do caso do Detetive Químico): esconde toda a interface do app e imprime
           apenas o conteúdo do container marcado como -print. */
        @media print {
            body * { visibility: hidden; }
            #ge-report-print, #ge-report-print *, #cd-report-print, #cd-report-print * { visibility: visible; }
            #ge-report-print, #cd-report-print { position: absolute; left: 0; top: 0; width: 100%; color: #000 !important; background: #fff !important; }
            #ge-report-print *, #cd-report-print * { color: #000 !important; background: #fff !important; border-color: #000 !important; }
        }

:root { color-scheme: dark; }

  body { padding-bottom: calc(64px + env(safe-area-inset-bottom)) !important; }
  #mobile-nav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bg-color); border-top: 2px solid var(--border-color); padding-bottom: env(safe-area-inset-bottom); }
  #mobile-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 6px 2px; min-height: 52px; color: var(--text-color); font-size: 1.3rem; line-height: 1.1; }
  #mobile-nav button span { font-size: .7rem; letter-spacing: .05em; }
  .bar-more { display: none; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .bar-more.open { display: flex; }
  .bar-more-toggle { display: inline-block; }
  .track strong { min-width: 100%; }
}
@media print { #mobile-nav, #net-bar, .mod-help { display: none !important; } }

/* v9.6 — conversor de unidade por campo e navegação da trilha */
.unit-btn { font-size: .72rem; padding: 0 6px !important; min-height: 24px !important; margin-top: 3px; display: inline-block; opacity: .9; }
.track-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 1.25rem; padding-top: .6rem; border-top: 1px dashed var(--border-color); font-size: .85rem; }
@media print { .unit-btn, .track-nav { display: none !important; } }

/* ===== CHEM.OS v10 — camada de refinamento de UI/UX (carrega depois de styles.css) ===== */
:root { --glow: color-mix(in srgb, var(--text-color) 55%, transparent); --tint: color-mix(in srgb, var(--text-color) 7%, transparent); --tint2: color-mix(in srgb, var(--text-color) 14%, transparent); }
html { scroll-behavior: smooth; scroll-padding-top: 4rem; }
::selection { background: var(--text-color); color: var(--bg-color); }

/* Fonte e leitura: texto com leve brilho de fósforo e linhas mais respiráveis */
body { line-height: 1.3; text-shadow: 0 0 6px color-mix(in srgb, var(--text-color) 28%, transparent); -webkit-font-smoothing: antialiased; }
html.reading-mode body, .theme-paper body, body.theme-paper { text-shadow: none; }
#screen-content { max-width: 1280px; margin-inline: auto; }

/* Cabeçalho fixo e limpo */
header[role=banner] { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(6px); background: color-mix(in srgb, var(--bg-color) 88%, transparent) !important; gap: .5rem 1rem; }
header[role=banner] .dos-btn { min-height: 28px; }
#sys-status::before { content: "● "; font-size: .7em; }

/* Seções do início: títulos como faixas, com respiro */
#screen-content h2, #screen-content h3.sec, #screen-content .section-title { letter-spacing: .12em; }

/* Cartões de módulo */
.menu-item { position: relative; border: 1px solid color-mix(in srgb, var(--text-color) 28%, transparent); background: var(--tint); padding: 8px 10px; border-radius: 0; transition: transform .14s ease, box-shadow .14s ease, background .14s ease, border-color .14s ease; }
.menu-item::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px; background: var(--text-color); opacity: .0; transition: opacity .14s; }
.menu-item:hover, .menu-item:focus-visible { transform: translateY(-2px); box-shadow: 0 4px 0 0 color-mix(in srgb, var(--text-color) 35%, transparent), 0 0 14px var(--glow); }
.menu-item:hover::before, .menu-item:focus-visible::before { opacity: 1; }
.menu-item:active { transform: translateY(0); box-shadow: none; }
.menu-item.yellow, .menu-item.cyan { background: var(--tint); }

/* Botões: estado pressionado e foco evidente */
.dos-btn { min-height: 34px; font-weight: 600; letter-spacing: .03em; }
.dos-btn:active { transform: translateY(1px) scale(.98); }
.dos-btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px dashed var(--text-color) !important; outline-offset: 3px; }

/* Campos: brilho ao focar */
#screen-content input:not([type=checkbox]):not([type=radio]):not([type=range]), #screen-content select, #screen-content textarea { min-height: 38px; transition: box-shadow .15s, background .15s; }
#screen-content input:focus, #screen-content select:focus, #screen-content textarea:focus { background: var(--tint); box-shadow: 0 2px 0 0 var(--text-color), 0 0 12px var(--glow); outline: none !important; }
#screen-content ::placeholder { opacity: .5; }

/* Linha de comando */
#cli-input { padding: 6px 4px; }
#cli-input:focus { outline: none !important; }
#viewport > div:last-child { position: sticky; bottom: 0; background: color-mix(in srgb, var(--bg-color) 92%, transparent); backdrop-filter: blur(4px); padding-bottom: 4px; }

/* Resultados: realce quando o conteúdo muda */
@keyframes resultFlash { from { background: var(--tint2); box-shadow: 0 0 18px var(--glow); } to { background: transparent; box-shadow: none; } }
.result-flash { animation: resultFlash .7s ease-out; }

/* Tabelas e conteúdo largo rolam dentro do próprio bloco */
#screen-content table { display: block; max-width: 100%; overflow-x: auto; }
#screen-content canvas, #screen-content svg, #screen-content img { max-width: 100%; height: auto; }

/* Scrollbar mais fácil de usar */
::-webkit-scrollbar { width: 10px; height: 10px; }
* { scrollbar-width: thin; scrollbar-color: var(--text-color) var(--bg-color); }

/* Botão voltar ao topo */
#to-top { position: fixed; right: 14px; bottom: 74px; z-index: 45; width: 44px; height: 44px; display: grid; place-items: center; font-size: 1.4rem; background: var(--bg-color); color: var(--text-color); border: 2px solid var(--border-color); opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .2s, transform .2s; cursor: pointer; }
#to-top.show { opacity: 1; transform: none; pointer-events: auto; }
#to-top:hover { background: var(--text-color); color: var(--bg-color); }

/* Celular: cabeçalho enxuto, alvos de toque ≥ 44px, rodapé sem atalhos de teclado */
@media (max-width: 640px) {
  header[role=banner] > div:nth-child(2), header[role=banner] > #clock { display: none; }
  header[role=banner] { justify-content: space-between; }
  .dos-btn, #screen-content button, #screen-content select { min-height: 44px; }
  .menu-item { padding: 12px 12px; }
  footer[role=contentinfo] > div:first-child { display: none; }
  footer[role=contentinfo] { justify-content: center; }
  #to-top { bottom: 70px; right: 10px; }
  #viewport > div:last-child { bottom: 0; }
}
@media (hover: none) { .menu-item:hover { transform: none; box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .menu-item, #to-top { transition: none; } .result-flash { animation: none; } }
@media print { #to-top { display: none !important; } }

/* ===== Rodada 2: legibilidade e ritmo ===== */
/* Texto pequeno em fonte pixelada era difícil de ler: piso de tamanho e mais contraste */
#screen-content .text-xs, #screen-content .text-\[10px\], #screen-content small { font-size: max(.95rem, 12px) !important; line-height: 1.35; }
#screen-content .opacity-60, #screen-content .opacity-70 { opacity: .8; }
#screen-content p, #screen-content .text-sm { line-height: 1.45; }
#screen-content label { display: block; margin-bottom: 2px; letter-spacing: .02em; }

/* Início: título menor ao rolar; seções com respiro e contagem visual */
#screen-content > .font-bold.text-5xl { text-shadow: 0 0 18px var(--glow); }
@media (min-width: 900px) { #screen-content .grid.md\:grid-cols-2 { column-gap: 14px; row-gap: 8px; } }

/* Resultado: alvo de leitura mais claro */
#screen-content [id^="res"], #screen-content [id$="-result"], #screen-content [id$="-res"], #screen-content [id$="-out"] { border-left: 4px solid var(--text-color); padding: 10px 12px; background: var(--tint); }

/* Transição suave de tema */
body, header, footer, main, .dos-border, .dos-btn { transition: background-color .25s, color .25s, border-color .25s; }

/* Dica de atalho: Enter calcula */
.enter-hint { font-size: .85rem; opacity: .65; margin-top: 6px; }
@media (hover: none) { .enter-hint { display: none; } }
